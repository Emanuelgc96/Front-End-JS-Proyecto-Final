<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!--LINK DE ICONOS DESCARGADOS-->
    <link rel="stylesheet" href="../Proyecto Supermercado TodoMarket/style.css">
</head>

<body>
    <header> <!-- Menu -->
        <img src="../Proyecto Supermercado TodoMarket/css/logo.png" alt="Logo TodoMarket" class="logo">
      
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="reseñas.html">Reseñas</a></li>

            </ul>
        </nav>
    </header>


    <main>
        
        <section id="reseñas"> <!--Reseñas-->
        
        <div class="reseñas-grid">
            <div class="reseña-card">
                <h3>Juan P.</h3> <!-- Nombre del cliente -->
                <p>"Excelente calidad, volveré a comprar."</p> <!-- Mensaje -->
                <p>⭐⭐⭐⭐⭐</p> <!-- Valoración tipo "checkpoints" -->
            </div>
            <div class="reseña-card">
                <h3>María G.</h3>
                <p>"Muy buena atención y productos frescos."</p>
                <p>⭐⭐⭐⭐</p>
            </div>
            <div class="reseña-card">
                <h3>Carlos L.</h3>
                <p>"Recomiendo TodoMarket a todos mis amigos."</p>
                <p>⭐⭐⭐⭐⭐</p>
            </div>
        </div>
    </section>
   

    
        <section id="crear-reseña"> <!--Escribir reseña-->
        <h2>Escribe tu reseña:</h2>
        <form action="https://formspree.io/f/mkgqqgla"id="form-reseña" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu reseña..." required></textarea>

            <label for="valoracion">Valoración:</label> <!--Seleccionar una opcion-->
            <select id="valoracion" name="valoracion" required>
                <option value="">Selecciona...</option>
                <option value="1">⭐</option>
                <option value="2">⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="4">⭐⭐⭐⭐</option>
                <option value="5">⭐⭐⭐⭐⭐</option>
            </select>


            <div class="botones">
                <button type="submit">Enviar</button>
                <button type="reset"><i class="fa-solid fa-trash"></i></button>
            </div>
        </form>

    </section>
     </main>
    
    <footer>
        <p>&copy; 2025 TodoMarket. Todos los derechos reservados.</p>
    </footer>



    <script src="/Proyectos/Proyecto Final/Proyecto Supermercado TodoMarket/js/index.js"></script>
</body>

</html>

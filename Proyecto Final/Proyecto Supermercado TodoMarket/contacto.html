        <section id="contacto">

                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>

                <input type="email" id="email" name="email" placeholder="Correo_electronico@ejemplo.com" required>

                    <button type="submit">Enviar</button>
                    <button type="reset"><i class="fa-solid fa-trash"></i></button>
